version: '3.8'

services:
  db:
    image: postgres:13
    container_name: mi_microservicio_db
    environment:
      - POSTGRES_DB=mi_db
      - POSTGRES_USER=mi_user
      - POSTGRES_PASSWORD=mi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis:
    image: redis:6-alpine
    container_name: mi_microservicio_redis

  app:
    build: .
    container_name: mi_microservicio_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=mi_db
      - POSTGRES_USER=mi_user
      - POSTGRES_PASSWORD=mi_password
    depends_on:
      - db
      - redis

volumes:
  postgres_data: